name: cppt-platform

services:
  backend:
    image: ${XUNTUI_BACKEND_IMAGE:-cppt-platform-backend:local}
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ${XUNTUI_ENV_FILE:-.env.production}
    environment:
      XUNTUI_LOCAL_RUNTIME_ENABLED: "false"
      XUNTUI_EVALUATION_ENABLED: "false"
      XUNTUI_MODEL_CATALOG: youyun-public
      XUNTUI_STORAGE_BACKEND: postgres
      XUNTUI_RELEASE_VERSION: ${XUNTUI_RELEASE_VERSION:-unknown}
      XUNTUI_BACKEND_HOST: 0.0.0.0
      XUNTUI_BACKEND_PORT: 8010
      # 平台展示时区：任务/日志时间戳、LLaMA-Factory 输出均按北京时间记录。
      TZ: Asia/Shanghai
      XUNTUI_TZ: Asia/Shanghai
      XUNTUI_RUNTIME_ROOT: /workspace/runtime
      XUNTUI_ARTIFACT_ROOT: /workspace/artifacts
      XUNTUI_DATASET_ROOT: /workspace/datasets
      XUNTUI_DATABASE_PATH: /workspace/runtime/compatibility.db
      XUNTUI_MODELSCOPE_CACHE: /workspace/model-cache
      XUNTUI_TRAINING_WORKDIR: /workspace/training-work
      XUNTUI_INFERENCE_PORT: 8011
      XUNTUI_REMOTE_LOG_FOLLOW_ENABLED: ${XUNTUI_REMOTE_LOG_FOLLOW_ENABLED:-true}
      XUNTUI_YOUYUN_RETENTION_HOURS: ${XUNTUI_YOUYUN_RETENTION_HOURS:-6}
      XUNTUI_YOUYUN_RETENTION_CHECK_MINUTES: ${XUNTUI_YOUYUN_RETENTION_CHECK_MINUTES:-5}
    user: "${XUNTUI_UID:-1000}:${XUNTUI_GID:-1000}"
    ports:
      - "${XUNTUI_BACKEND_BIND:-127.0.0.1}:${XUNTUI_BACKEND_HOST_PORT:-8010}:8010"
      - "${XUNTUI_INFERENCE_BIND:-127.0.0.1}:${XUNTUI_INFERENCE_HOST_PORT:-8011}:8011"
    volumes:
      - ${XUNTUI_DEPLOY_DATA_ROOT:-./deploy-data}/runtime:/workspace/runtime
      - ${XUNTUI_DEPLOY_DATA_ROOT:-./deploy-data}/artifacts:/workspace/artifacts
      - ${XUNTUI_DEPLOY_DATA_ROOT:-./deploy-data}/datasets:/workspace/datasets
      - ${XUNTUI_DEPLOY_DATA_ROOT:-./deploy-data}/uploads:/workspace/uploads
      - ${XUNTUI_DEPLOY_DATA_ROOT:-./deploy-data}/model-cache:/workspace/model-cache
      - ${XUNTUI_DEPLOY_DATA_ROOT:-./deploy-data}/training-work:/workspace/training-work
    init: true
    shm_size: ${XUNTUI_BACKEND_SHM_SIZE:-2gb}
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: ${XUNTUI_FRONTEND_IMAGE:-cppt-platform-frontend:local}
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_INFERENCE_BASE_URL: ${NEXT_PUBLIC_INFERENCE_BASE_URL:-}
        NEXT_PUBLIC_AUTH_CALLBACK_URL: ${NEXT_PUBLIC_AUTH_CALLBACK_URL:-/api/auth/callback}
        CPPT_DOCS_BACKEND_ORIGIN: ${CPPT_DOCS_BACKEND_ORIGIN:-http://backend:8010}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${XUNTUI_FRONTEND_BIND:-127.0.0.1}:${XUNTUI_FRONTEND_HOST_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
